# Widescreen Patch Configuration
# These are example patches for SWROTS-PC widescreen support

[general]
# Enable widescreen patches
enabled=true

# Aspect ratio (16:9 = 1.777...)
aspect_ratio=1.7777778

# Field of view adjustment
fov_base=75.0
fov_widescreen=90.0

[patches]
# Memory patches for widescreen
# Format: offset=type:value

# Example: Patch aspect ratio variable
# 0x12345678=float:1.7777778

# Example: Patch FOV
# 0x12345680=float:90.0

[resolutions]
# Supported widescreen resolutions
1920x1080=16:9
2560x1440=16:9
3840x2160=16:9
1280x720=16:9

[hud]
# HUD scaling options
scale_hud=true
hud_offset_x=0.0
hud_offset_y=0.0
